name: Awaken

on:
  schedule:
    - cron: "7 */3 * * *" # 01:07, 04:07, 07:07, 10:07, 13:07, 16:07, 19:07, 22:07 in UTC+7
  workflow_dispatch:
  push:
    branches: [main]
    paths: [awaken.json]

permissions:
  contents: write

concurrency:
  group: awaken
  cancel-in-progress: true

jobs:
  awaken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: billtruong003/git-profile-awaken@main